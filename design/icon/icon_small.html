<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;width:100%;height:100%;background:transparent}svg{display:block}</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1024 1024" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#20244a"/>
      <stop offset="60%" stop-color="#101528"/>
      <stop offset="100%" stop-color="#080a14"/>
    </linearGradient>
    <linearGradient id="barA" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#6f4bff"/>
      <stop offset="100%" stop-color="#3ad8ff"/>
    </linearGradient>
    <linearGradient id="barHot" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8a5bff"/>
      <stop offset="50%" stop-color="#43ecff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="72" y="72" width="880" height="880" rx="208" fill="url(#bg)"/>

  <!-- baseline -->
  <line x1="150" y1="748" x2="874" y2="748" stroke="#4a5488" stroke-width="14" stroke-linecap="round" opacity=".7"/>

  <!-- 4 chunky bars -->
  <rect x="150" y="486" width="150" height="262" rx="46" fill="url(#barA)"/>
  <rect x="356" y="288" width="150" height="460" rx="46" fill="url(#barA)"/>
  <g filter="url(#glow)">
    <rect x="562" y="168" width="150" height="580" rx="46" fill="url(#barHot)"/>
  </g>
  <rect x="562" y="168" width="150" height="580" rx="46" fill="url(#barHot)"/>
  <rect x="768" y="398" width="150" height="350" rx="46" fill="url(#barA)"/>

  <!-- caps -->
  <rect x="150" y="486" width="150" height="40" rx="20" fill="#e9fbff"/>
  <rect x="356" y="288" width="150" height="40" rx="20" fill="#e9fbff"/>
  <rect x="562" y="168" width="150" height="44" rx="22" fill="#ffffff"/>
  <rect x="768" y="398" width="150" height="40" rx="20" fill="#e9fbff"/>
</svg>
</body>
</html>
